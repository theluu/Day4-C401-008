# starter_v0 — tool declarations (optimized).
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Gửi câu hỏi làm rõ cho người dùng khi thiếu thông tin quan trọng (như thiếu tên tài khoản Twitter, thiếu link URL) hoặc để hỏi xác nhận (yes_no) trước khi gửi tin nhắn lên Telegram."
    parameters:
      type: object
      properties:
        question: {type: string, description: "Câu hỏi gửi cho người dùng để làm rõ thông tin hoặc xin xác nhận."}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu phản hồi mong đợi: 'text' để làm rõ thông tin, 'yes_no' để lấy xác nhận đồng ý/không đồng ý."}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn nếu response_type là choice."}
      required: [question]

  - name: timeline
    description: "Lấy danh sách các bài đăng (tweets) gần đây của một tài khoản Twitter/X cụ thể bằng screenname. Chỉ gọi khi đã xác định được handle/tên tài khoản của người đó."
    parameters:
      type: object
      properties:
        screenname: {type: string, description: "Tên handle Twitter (ví dụ: sama, elonmusk, karpathy)."}
        limit: {type: integer, default: 5, description: "Số lượng tweet cần lấy."}
      required: [screenname]

  - name: social_search
    description: "Tìm kiếm các bài đăng theo từ khóa, xu hướng thảo luận hoặc chủ đề trên mạng xã hội Twitter/X. Chỉ gọi khi người dùng yêu cầu tìm kiếm trên Twitter/mạng xã hội."
    parameters:
      type: object
      properties:
        query: {type: string, description: "Từ khóa cần tìm kiếm (chỉ chứa thực thể chính, ví dụ: 'GPT-5'). Không chứa từ khóa thời gian hay từ hỏi."}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp kết quả: Top (phổ biến nhất) hoặc Latest (mới nhất)."}
        limit: {type: integer, default: 5, description: "Số lượng kết quả cần lấy."}
      required: [query]

  - name: lookup
    description: "Tra cứu thông tin tổng hợp hoặc tin tức thời sự trên mạng internet/Google. Sử dụng topic='news' cho tin tức thời sự và timeframe tương ứng."
    parameters:
      type: object
      properties:
        query: {type: string, description: "Từ khóa chính cần tìm kiếm (ví dụ: 'AI', 'robotics'). Chỉ chứa thực thể cốt lõi, KHÔNG chứa các từ như 'tin tức', 'tin', 'hôm nay', 'tuần này', 'bản tin'."}
        topic: {type: string, enum: [general, news], default: "general", description: "Phân loại tìm kiếm: 'news' cho tin tức thời sự mới, 'general' cho thông tin chung."}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian giới hạn tin tức: 'day' (hôm nay/24h qua), 'week' (tuần này), 'month' (tháng này), 'year' (năm nay)."}
        max_results: {type: integer, default: 5, description: "Số kết quả tối đa."}
      required: [query]

  - name: fetch
    description: "Đọc và lấy toàn bộ nội dung văn bản từ một địa chỉ trang web URL cụ thể do người dùng cung cấp."
    parameters:
      type: object
      properties:
        url: {type: string, description: "Địa chỉ URL đầy đủ của trang web cần đọc."}
      required: [url]

  - name: format
    description: "Trình bày danh sách các item thông tin thu thập được thành một bản tin/digest bằng Markdown."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách các mục thông tin cần định dạng."
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn mẫu trình bày bản tin."}
        headline: {type: string, default: "", description: "Tiêu đề của bản tin."}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi đoạn văn bản/bản tin lên Telegram channel. Chỉ thực hiện khi confirmed=true."
    parameters:
      type: object
      properties:
        text: {type: string, description: "Nội dung văn bản cần gửi."}
        confirmed: {type: boolean, default: false, description: "Phải truyền true để xác nhận gửi. Chỉ đặt true khi người dùng đã đồng ý trong hội thoại."}
      required: [text]

  - name: policy
    description: "Tìm kiếm thông tin chính sách nội bộ của công ty trong cẩm nang hướng dẫn."
    parameters:
      type: object
      properties:
        query: {type: string, description: "Nội dung truy vấn cần tìm."}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm chính sách cần tra cứu: 'ai_research' (quy trình nghiên cứu), 'source_citation' (quy tắc trích dẫn), 'data_privacy' (bảo mật, API key), 'external_publishing' (Telegram, xuất bản), 'tool_usage' (sử dụng công cụ)."}
        top_k: {type: integer, default: 3, description: "Số mục chính sách cần lấy."}
      required: [query]

  - name: papers
    description: "Tìm kiếm các bài báo khoa học hoặc bản thảo preprint học thuật trên arXiv."
    parameters:
      type: object
      properties:
        query: {type: string, description: "Từ khóa chính để tìm bài báo."}
        max_results: {type: integer, default: 5, description: "Số kết quả tối đa."}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp theo độ liên quan hoặc thời gian."}
      required: [query]

  - name: paper_text
    description: "Tải và trích xuất nội dung văn bản từ một bài báo khoa học arXiv cụ thể."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, description: "Mã số arXiv ID (ví dụ: '1706.03762') hoặc URL của bài viết trên arXiv."}
        max_pages: {type: integer, default: 5, description: "Số trang tối đa cần trích xuất."}
        max_chars: {type: integer, default: 8000, description: "Số lượng ký tự tối đa cần trích xuất."}
      required: [arxiv_url]

  - name: wikipedia
    description: "Tìm kiếm thông tin tóm tắt trên Wikipedia cho một chủ đề cụ thể."
    parameters:
      type: object
      properties:
        query: {type: string, description: "Từ khóa hoặc tiêu đề cần tìm trên Wikipedia."}
      required: [query]

  - name: email
    description: "Gửi một email đến địa chỉ người nhận. Chỉ thực hiện khi confirmed=true."
    parameters:
      type: object
      properties:
        to: {type: string, description: "Địa chỉ email của người nhận."}
        subject: {type: string, description: "Tiêu đề của email."}
        body: {type: string, description: "Nội dung chính của email."}
        confirmed: {type: boolean, default: false, description: "Phải truyền true để xác nhận gửi. Chỉ đặt true khi người dùng đã đồng ý trong hội thoại."}
      required: [to, subject, body]
